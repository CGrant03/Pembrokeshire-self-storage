<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Direct Debit setup — Pembrokeshire Self Storage</title><style>body{font:18px/1.6 system-ui;background:#f4f6f7;color:#102b3a;margin:0;padding:32px}main{max-width:600px;margin:10vh auto;background:white;padding:32px;border-radius:18px}a{color:#174569}</style></head><body><main><img src="logo.jpeg" width="210" alt="Pembrokeshire Self Storage"><h1>Payment and bank setup</h1><p id="result">Thank you. GoCardless is processing your setup. Pembrokeshire Self Storage will check the authorisation status and confirm your payment arrangements.</p><p>Completing this setup does not itself mean a payment has been collected.</p><a href="./">Return to Pembrokeshire Self Storage</a></main><script>
const token=location.hash.slice(1);
if(token&&!new URLSearchParams(location.search).has('cancelled')){
 let attempts=0;
 async function check(){try{const r=await fetch('https://vxurmlmmrlclfydiobgm.supabase.co/functions/v1/gocardless-manage',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'payment_status',token})});const d=await r.json();if(r.ok&&d.upfront){const paid=['confirmed','paid_out'].includes(d.first_payment_status);document.getElementById('result').textContent=d.needs_attention?'Your setup needs a check by our team. Please contact us before retrying payment.':paid?(d.subscription_status==='active'?'Your first payment is confirmed and monthly Direct Debit is scheduled.':'Your first payment is confirmed. Your monthly Direct Debit is still being set up.'):'We are checking your first payment and bank setup with GoCardless. Please do not pay again. Contact us if this remains pending.';if(paid){document.getElementById('result').textContent+=d.access_sent?' Your gate and container lock-box codes have been emailed to you. Please check your inbox.':d.access_error?' Your access email needs a retry. Please contact us.':' Your access details are waiting for your complete signed agreement and ID. Please contact us if you have already supplied these.';}if(!d.needs_attention&&(!d.access_sent)&&++attempts<6)setTimeout(check,5000);}}catch{document.getElementById('result').textContent='We could not check your payment status. Please contact us before trying another payment.';}}
 check();
}
if(new URLSearchParams(location.search).has('cancelled'))document.getElementById('result').textContent='You left the setup process. Contact Pembrokeshire Self Storage if you need a new setup link.';</script></body></html>
